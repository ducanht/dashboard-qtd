<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#022753" />
  <title>eFUND Core Banking — QTDND Yên Thọ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #022753 0%, #004AA1 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3.5px solid rgba(255,255,255,0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #f8fafc; }
    p.unit { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    p.status { font-size: 14px; color: #cbd5e1; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: block;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(22,163,74,0.4);
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">HĐQT SUITE v5.0 ONLINE</div>
    <div class="spinner"></div>
    <h2>eFUND CORE BANKING</h2>
    <p class="unit">Quỹ Tín Dụng Nhân Dân Yên Thọ</p>
    <p class="status" id="statusMsg">Đang kết nối vào máy chủ nội bộ...</p>
    <a class="btn" id="directBtn" href="https://fggiu-2405-4802-318f-5b10-9981-ffe5-121d-342e.free.pinggy.net">Bấm vào đây để vào ngay</a>
    <div class="footer">Bảo mật đa tầng • Mã hóa đường truyền SSL 256-bit</div>
  </div>
  <script>
    const FALLBACK_URL = "https://fggiu-2405-4802-318f-5b10-9981-ffe5-121d-342e.free.pinggy.net";
    let redirected = false;
    function go(targetUrl) {
      if (redirected || !targetUrl) return;
      redirected = true;
      document.getElementById('directBtn').href = targetUrl;
      document.getElementById('statusMsg').textContent = 'Đang chuyển hướng vào hệ thống...';
      window.location.replace(targetUrl);
    }
    const timer = setTimeout(() => go(FALLBACK_URL), 2500);
    fetch('https://raw.githubusercontent.com/' + "ducanht/dashboard-qtd" + '/main/url.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(d => {
        clearTimeout(timer);
        if (d && d.url) {
          go(d.url);
        } else {
          go(FALLBACK_URL);
        }
      })
      .catch(() => {
        clearTimeout(timer);
        go(FALLBACK_URL);
      });
  </script>
</body>
</html>
